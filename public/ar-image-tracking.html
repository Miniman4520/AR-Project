<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 1. Import the necessary libraries: A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-aframe.prod.js"></script>
    
    <title>Step-by-Step 3D Tracking</title>
    <style>
      /* Add basic styling to ensure the scene fills the whole screen */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      a-scene {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- 
      2. Set up the AR scene with more robust attributes.
         - 'embedded': Important for running in a webpage.
         - 'renderer' & 'color-space': Help with proper rendering.
         - 'uiScanning: default;': This is the key fix. It shows a loading/scanning UI.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; uiScanning: default;" 
      embedded
      color-space="sRGB" 
      renderer="colorManagement: true, logarithmicDepthBuffer: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- 3. Set up the camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 
        4. Define the image target.
           - 'targetIndex: 0': It will look for the first image defined in the .mind file.
      -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          5. Place your 3D object here.
             This red box is a child of the image target.
             When the target is detected, this box will appear and "stick" to it in 3D space.
        -->
        <a-box 
          position="0 0 0.1" 
          material="color: red; opacity: 0.6">
        </a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
