<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR 3D Object Tracking</title>
    
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <!-- Three.js for 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #canvas3d {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #ar-title {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
      }
      #detection-info {
        position: fixed;
        top: 80px;
        left: 20px;
        color: white;
        font-size: 16px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 5px;
        max-width: 300px;
      }
      #status {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 14px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 10px 20px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="ar-title">AR 3D Object Tracking</div>
    <div id="detection-info">Loading AI model...</div>
    <div id="status">Initializing camera...</div>
    
    <div id="container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas3d"></canvas>
    </div>

    <script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas3d');
  const statusDiv = document.getElementById('status');
  const detectionInfo = document.getElementById('detection-info');
  const ctx = canvas.getContext('2d');
  
  let model;
  let isDetecting = false;
  let videoWidth, videoHeight;
  
  // Start camera
  async function setupCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30} },
      });
      
      video.srcObject = stream;
      
      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          canvas.width = videoWidth;
          canvas.height = videoHeight;
          statusDiv.textContent = '✅ Camera ready';
          resolve();
        };
      });
    } catch (error) {
      statusDiv.textContent = '❌ Camera error';
      console.error('Camera error:', error);
    }
  }
  
  // Load COCO-SSD model
  async function loadModel() {
    statusDiv.textContent = 'Loading AI model...';
    try {
      model = await cocoSsd.load();
      statusDiv.textContent = '✅ Ready! Show perfume box to camera';
      detectionInfo.innerHTML = '<strong>Tracking: Perfume Box</strong><br>Waiting for object...';
      isDetecting = true;
      detectObjects();
    } catch (error) {
      statusDiv.textContent = '❌ Error loading model';
      console.error('Error loading model:', error);
    }
  }
  
  // Detect and track objects
  async function detectObjects() {
    if (!model || !isDetecting) return;
    
    try {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Run detection
      const predictions = await model.detect(video);
      
      // Filter for small objects
      const validClasses = ['cell phone', 'remote', 'mouse', 'keyboard', 'book', 'bottle', 'cup', 'clock', 'vase'];
      
      const smallObjects = predictions.filter(p => {
        if (!validClasses.includes(p.class)) return false;
        
        const [x, y, width, height] = p.bbox;
        const objectArea = width * height;
        const frameArea = videoWidth * videoHeight;
        const areaRatio = objectArea / frameArea;
        
        return areaRatio > 0.03 && areaRatio < 0.3;
      });
      
      if (smallObjects.length > 0) {
        const bestObject = smallObjects.reduce((prev, current) => 
          (prev.score > current.score) ? prev : current
        );
        
        const [x, y, width, height] = bestObject.bbox;
        const confidence = Math.round(bestObject.score * 100);
        
        // Draw 3D-looking box that exactly matches the detection outline
        draw3DBox(x, y, width, height);
        
        // Update info
        detectionInfo.innerHTML = `
          <strong>✅ Tracking: Perfume Box</strong><br>
          Confidence: ${confidence}%<br>
          Position: (${Math.round(x)}, ${Math.round(y)})<br>
          Size: ${Math.round(width)}×${Math.round(height)}<br>
          <small>Detected as: ${bestObject.class}</small>
        `;
      } else {
        detectionInfo.innerHTML = `
          <strong>Tracking: Perfume Box</strong><br>
          Not detected - show box to camera<br>
          <small>Hold a small rectangular object</small>
        `;
      }
      
    } catch (error) {
      console.error('Detection error:', error);
    }
    
    // Run detection continuously
    requestAnimationFrame(detectObjects);
  }
  
  // Draw 3D box overlay that matches detection outline exactly
  function draw3DBox(x, y, width, height) {
    // Define 3D depth offset for perspective
    const depth = Math.min(width, height) * 0.15;
    
    // Front face (red, semi-transparent)
    ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
    ctx.fillRect(x, y, width, height);
    
    // Front face border (red, solid)
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, width, height);
    
    // Draw 3D effect - connecting lines to show depth
    ctx.strokeStyle = '#00FF00';
    ctx.lineWidth = 2;
    
    // Top-left to back
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - depth, y - depth);
    ctx.stroke();
    
    // Top-right to back
    ctx.beginPath();
    ctx.moveTo(x + width, y);
    ctx.lineTo(x + width - depth, y - depth);
    ctx.stroke();
    
    // Bottom-left to back
    ctx.beginPath();
    ctx.moveTo(x, y + height);
    ctx.lineTo(x - depth, y + height - depth);
    ctx.stroke();
    
    // Bottom-right to back
    ctx.beginPath();
    ctx.moveTo(x + width, y + height);
    ctx.lineTo(x + width - depth, y + height - depth);
    ctx.stroke();
    
    // Back face (lighter red)
    ctx.strokeStyle = '#FF6666';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - depth, y - depth, width, height);
    
    // Fill back face
    ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
    ctx.fillRect(x - depth, y - depth, width, height);
    
    // Draw corner markers on front face
    const cornerSize = 15;
    ctx.strokeStyle = '#00FF00';
    ctx.lineWidth = 3;
    
    // Top-left corner
    ctx.beginPath();
    ctx.moveTo(x, y + cornerSize);
    ctx.lineTo(x, y);
    ctx.lineTo(x + cornerSize, y);
    ctx.stroke();
    
    // Top-right corner
    ctx.beginPath();
    ctx.moveTo(x + width - cornerSize, y);
    ctx.lineTo(x + width, y);
    ctx.lineTo(x + width, y + cornerSize);
    ctx.stroke();
    
    // Bottom-left corner
    ctx.beginPath();
    ctx.moveTo(x, y + height - cornerSize);
    ctx.lineTo(x, y + height);
    ctx.lineTo(x + cornerSize, y + height);
    ctx.stroke();
    
    // Bottom-right corner
    ctx.beginPath();
    ctx.moveTo(x + width - cornerSize, y + height);
    ctx.lineTo(x + width, y + height);
    ctx.lineTo(x + width, y + height - cornerSize);
    ctx.stroke();
    
    // Label
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = 'rgba(255, 0, 0, 0.9)';
    const labelText = '3D AR OVERLAY';
    const textWidth = ctx.measureText(labelText).width;
    ctx.fillRect(x + (width - textWidth - 20) / 2, y - 25, textWidth + 20, 20);
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText(labelText, x + width / 2, y - 10);
  }
  
  // Initialize
  async function init() {
    await setupCamera();
    await loadModel();
  }
  
  init();
</script>
  </body>
</html>
