<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developing Generative Texture on Commercial Packaging in Extended Reality</title>
    
    <!-- A-Frame + AR.js -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      #ar-title {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 22px;
        z-index: 9999;
        text-align: center;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.55);
        padding: 12px 20px;
        border-radius: 8px;
        line-height: 1.4;
      }
      #ar-subtitle {
        display: block;
        font-size: 15px;
        color: #cfcfcf;
        margin-top: 4px;
        font-weight: normal;
      }
      #instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 15px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 12px 18px;
        border-radius: 6px;
        text-align: center;
      }
      #instructions a {
        color: #4CAF50;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div id="ar-title">
      🧠 Developing Generative Texture on Commercial Packaging
      <span id="ar-subtitle">Exploring interactive design through Extended Reality</span>
    </div>

    <div id="instructions">
      📷 Point your camera at the <b>Hiro Marker</b> to view the 3D packaging model.<br>
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">
        Download Hiro Marker
      </a>
    </div>
    
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false"
      renderer="antialias: true; logarithmicDepthBuffer: true">

      <a-assets>
        <img id="faceImg" src="https://picsum.photos/512" crossorigin="anonymous">
      </a-assets>

      <a-marker preset="hiro">
        <a-entity scale="1.5 4.5 1.5" position="0 -1.5 0">
          <a-box color="#FF0000" opacity="1" width="1" height="1" depth="1"></a-box>

          <!-- front face overlay -->
          <a-plane
            id="frontFace"
            position="0 0 0.751"
            rotation="0 0 0"
            width="1"
            height="1"
            material="shader: flat; src: #faceImg">
          </a-plane>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
