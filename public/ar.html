<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Object Detection</title>
    
    <!-- Use the working script versions from test -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #ar-title {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
      }
      #instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 16px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="ar-title">AR Object Detection Demo</div>
    <div id="instructions">
      📷 Point camera at Hiro marker to see AR!<br>
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" style="color: #4CAF50;">Download Hiro Marker</a>
    </div>
    
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        <a-entity
          scale="1.5 4.5 1.5"     
          position="0 -1.5 0" 
      >
          <a-box 
            color="#FF0000" 
            opacity="1"  
            width="1"
            height="1"
            depth="1"
          ></a-box>
        </a-entity>
    
        </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
