<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Object Tracking</title>
    
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #ar-title {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
      }
      #detection-info {
        position: fixed;
        top: 80px;
        left: 20px;
        color: white;
        font-size: 16px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 5px;
        max-width: 300px;
      }
      #status {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 14px;
        z-index: 9999;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        background: rgba(0,0,0,0.7);
        padding: 10px 20px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="ar-title">AR Object Tracking</div>
    <div id="detection-info">Loading AI model...</div>
    <div id="status">Initializing camera...</div>
    
    <div id="container">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <script>
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const statusDiv = document.getElementById('status');
      const detectionInfo = document.getElementById('detection-info');
      
      let model;
      let isDetecting = false;
      
      // Target object to track (change this to what you want to detect)
      const TARGET_OBJECT = 'cellphone'; // Can be: bottle, cup, cell phone, person, etc.
      
      // Start camera
      async function setupCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 }
          });
          
          video.srcObject = stream;
          
          return new Promise((resolve) => {
            video.onloadedmetadata = () => {
              video.play();
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              statusDiv.textContent = '✅ Camera ready';
              resolve();
            };
          });
        } catch (error) {
          statusDiv.textContent = '❌ Camera error';
          console.error('Camera error:', error);
        }
      }
      
      // Load COCO-SSD model
      async function loadModel() {
        statusDiv.textContent = 'Loading AI model...';
        try {
          model = await cocoSsd.load();
          statusDiv.textContent = '✅ Ready! Show perfume box to camera';
          detectionInfo.innerHTML = `<strong>Tracking: Perfume Box</strong><br>Waiting for object...`;
          isDetecting = true;
          detectObjects();
        } catch (error) {
          statusDiv.textContent = '❌ Error loading model';
          console.error('Error loading model:', error);
        }
      }
      
      // Detect and track objects
      // Detect and track objects
// Detect and track objects
async function detectObjects() {
  if (!model || !isDetecting) return;
  
  try {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Run detection
    const predictions = await model.detect(video);
    
    // Filter for small objects (NOT person, NOT large objects)
    const validClasses = ['cell phone', 'remote', 'mouse', 'keyboard', 'book', 'bottle', 'cup', 'clock', 'vase'];
    
    const smallObjects = predictions.filter(p => {
      // Must be in valid classes (small objects)
      if (!validClasses.includes(p.class)) return false;
      
      const [x, y, width, height] = p.bbox;
      const objectArea = width * height;
      const frameArea = canvas.width * canvas.height;
      const areaRatio = objectArea / frameArea;
      
      // Keep objects that are 3% to 30% of frame
      return areaRatio > 0.03 && areaRatio < 0.3;
    });
    
    if (smallObjects.length > 0) {
      // Found object - use the most confident one
      const bestObject = smallObjects.reduce((prev, current) => 
        (prev.score > current.score) ? prev : current
      );
      
      const [x, y, width, height] = bestObject.bbox;
      const confidence = Math.round(bestObject.score * 100);
      
      // Draw bounding box
      ctx.strokeStyle = '#00FF00';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, width, height);
      
      // Draw AR overlay box (simulating 3D model position)
      drawARBox(x, y, width, height);
      
      // Update info - call it "box" regardless of what model thinks
      detectionInfo.innerHTML = `
        <strong>✅ Tracking: Perfume Box</strong><br>
        Confidence: ${confidence}%<br>
        Position: (${Math.round(x)}, ${Math.round(y)})<br>
        Size: ${Math.round(width)}×${Math.round(height)}<br>
        <small>Detected as: ${bestObject.class}</small>
      `;
    } else {
      // No suitable object found
      detectionInfo.innerHTML = `
        <strong>Tracking: Perfume Box</strong><br>
        Not detected - show box to camera<br>
        <small>Hold a small rectangular object</small>
      `;
      
      // Show all detected objects for debugging
      if (predictions.length > 0) {
        const detected = predictions.map(p => p.class).join(', ');
        detectionInfo.innerHTML += `<br><small>Seeing: ${detected}</small>`;
      }
    }
    
  } catch (error) {
    console.error('Detection error:', error);
  }
  
  // Run detection continuously
  requestAnimationFrame(detectObjects);
}
// Draw AR box overlay covering the entire object
function drawARBox(x, y, width, height) {
  // Draw semi-transparent red overlay covering the entire detected object
  ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
  ctx.fillRect(x, y, width, height);
  
  // Draw thick border around the object
  ctx.strokeStyle = '#FF0000';
  ctx.lineWidth = 4;
  ctx.strokeRect(x, y, width, height);
  
  // Draw corner markers (like AR markers have)
  const cornerSize = 20;
  ctx.strokeStyle = '#00FF00';
  ctx.lineWidth = 3;
  
  // Top-left corner
  ctx.beginPath();
  ctx.moveTo(x, y + cornerSize);
  ctx.lineTo(x, y);
  ctx.lineTo(x + cornerSize, y);
  ctx.stroke();
  
  // Top-right corner
  ctx.beginPath();
  ctx.moveTo(x + width - cornerSize, y);
  ctx.lineTo(x + width, y);
  ctx.lineTo(x + width, y + cornerSize);
  ctx.stroke();
  
  // Bottom-left corner
  ctx.beginPath();
  ctx.moveTo(x, y + height - cornerSize);
  ctx.lineTo(x, y + height);
  ctx.lineTo(x + cornerSize, y + height);
  ctx.stroke();
  
  // Bottom-right corner
  ctx.beginPath();
  ctx.moveTo(x + width - cornerSize, y + height);
  ctx.lineTo(x + width, y + height);
  ctx.lineTo(x + width, y + height - cornerSize);
  ctx.stroke();
  
  // Draw label at the top
  const labelText = '3D MODEL OVERLAY';
  ctx.font = 'bold 16px Arial';
  ctx.fillStyle = 'rgba(255, 0, 0, 0.9)';
  const textWidth = ctx.measureText(labelText).width;
  ctx.fillRect(x + (width - textWidth - 20) / 2, y - 30, textWidth + 20, 25);
  
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.fillText(labelText, x + width / 2, y - 10);
  
  // Add instruction text
  ctx.font = '12px Arial';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(x, y + height + 5, width, 20);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('Mahnoor\'s 3D model will appear here', x + width / 2, y + height + 18);
}
      // Initialize
      async function init() {
        await setupCamera();
        await loadModel();
      }
      
      init();
    </script>
  </body>
</html>
