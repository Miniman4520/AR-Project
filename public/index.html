<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Object Detection Project</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .button {
            display: block;
            padding: 20px;
            margin: 15px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .button:active {
            transform: translateY(0);
        }
        .description {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 AR Object Detection</h1>
        <p>Choose an AR experience:</p>
        
        <a href="/ar.html" class="button">
            📍 Marker-Based AR
            <div class="description">Use Hiro marker to see 3D objects</div>
        </a>
        
        <a href="/ar-3d-tracking.html" class="button">
            📦 Object Tracking AR
            <div class="description">Point at objects for real-time 3D overlay</div>
        </a>
        
        <p style="margin-top: 30px; text-align: center; font-size: 12px;">
            Built with AR.js, TensorFlow.js & Three.js
        </p>
    </div>
</body>
</html>
